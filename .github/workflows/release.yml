name: Build Release APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Prepare Signing Keystore
        run: |
          # If debug.keystore is missing (due to .gitignore), restore it from debug.keystore.base64
          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            echo "Restoring debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          # Fallback: if debug.keystore still does not exist, generate one with keytool
          if [ ! -f "debug.keystore" ]; then
            echo "Generating fallback debug.keystore for APK signing..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo "Keystore ready:"
          ls -l debug.keystore

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify Release APK
        run: |
          echo "Built APK files:"
          find app/build/outputs/apk/ -type f -name "*.apk" -ls

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
